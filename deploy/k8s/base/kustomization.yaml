apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# The secret is never in the repository. Make it once:
#
#   docker run --rm logbook-server:latest vapid          # prints both halves
#   kubectl create secret generic logbook-vapid \
#     --from-literal=public=<public> --from-literal=private=<private>
#
# Rotating it silently invalidates every existing subscription — every device
# stops receiving and nothing reports an error — so back the private half up.
